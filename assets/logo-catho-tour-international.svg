<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070B19" />
    </linearGradient>
    <linearGradient id="africaFill" x1="14" y1="14" x2="50" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="crossStroke" x1="28" y1="7" x2="28" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="55%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>
  <!-- Rounded Emblem Shield -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bgGrad)" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.6" />
  <!-- Outer Universal Ring & 4 Kente Cardinal Diamonds -->
  <circle cx="32" cy="32" r="27" stroke="#D4AF37" stroke-width="1.1" stroke-opacity="0.45" />
  <circle cx="32" cy="32" r="23.5" stroke="#D4AF37" stroke-width="0.75" stroke-dasharray="2 2.5" stroke-opacity="0.35" />
  <polygon points="32,2.5 34,5 32,7.5 30,5" fill="#D4AF37" />
  <polygon points="32,56.5 34,59 32,61.5 30,59" fill="#D4AF37" />
  <polygon points="2.5,32 5,34 7.5,32 5,30" fill="#D4AF37" />
  <polygon points="56.5,32 59,34 61.5,32 59,30" fill="#D4AF37" />
  <!-- Stylized Silhouette of the African Continent -->
  <path
    d="M23 16.5 C17.5 17.5 13.5 23 14.5 29 C15.2 33.5 20.5 35 26.5 34.8 C28.5 34.8 29.8 41.5 31.8 48.5 C33.5 53.5 37.8 53.5 40.5 48.5 C43.2 43.5 44.5 37.5 48.5 31.5 C50.2 28.8 46.5 25.5 43.8 21.5 C41 17.8 36.8 15.8 30.5 15.8 Z"
    fill="url(#africaFill)"
    stroke="#D4AF37"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
  <!-- Eucharistic Halo & West-African Cradle Point -->
  <circle cx="26.5" cy="23.5" r="6" stroke="#FDE68A" stroke-width="1.1" stroke-opacity="0.75" />
  <circle cx="26.5" cy="23.5" r="2" fill="#FFFBEB" />
  <!-- Slender Catholic Cross Rising from the Heart of Africa -->
  <path d="M26.5 8.5 V45.5 M16.5 23.5 H36.5" stroke="url(#crossStroke)" stroke-width="2.6" stroke-linecap="round" />
</svg>
